# Secret for DOCTA OAuth credentials.
# Values must be base64-encoded: echo -n "your-value" | base64
# Do NOT commit real credentials — use a secrets manager or sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: docta-secrets
  namespace: docta
type: Opaque
data:
  # TODO: replace placeholder values with base64-encoded real credentials
  GRAPHQL_CLIENT_ID: eW91ci1jbGllbnQtaWQ=        # "your-client-id"
  GRAPHQL_CLIENT_SECRET: eW91ci1jbGllbnQtc2VjcmV0  # "your-client-secret"
  GRAPHQL_TOKEN_URL: aHR0cHM6Ly9hdXRoLmV4YW1wbGUuY29tL29hdXRoL3Rva2Vu  # placeholder URL
