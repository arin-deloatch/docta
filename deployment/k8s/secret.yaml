# Secret for DOCTA OAuth credentials.
# Values must be base64-encoded: echo -n "your-value" | base64
# Do NOT commit real credentials — use a secrets manager or sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: docta-secrets
  namespace: docta
type: Opaque
stringData:
  # TODO: replace placeholder values with base64-encoded real credentials
  GRAPHQL_CLIENT_ID: your-client-id      
  GRAPHQL_CLIENT_SECRET: your-client-secret
  GRAPHQL_TOKEN_URL: https://auth.example.com/oauth/token
  APOLLOGRAPHQL_CLIENT_NAME: your-apollographql-client-name