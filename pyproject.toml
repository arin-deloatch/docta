[project]
name = "docta"
version = "0.2.1"
description = "Documentation change tracker with semantic diff extraction, fuzzy rename detection, GraphQL polling, and optional QA generation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "beautifulsoup4>=4.12.0",
  "html2text>=2024.2.26",
  "lxml>=6.1.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.0.0",
  "rapidfuzz>=3.9.0",
  "requests>=2.32.4",
  "structlog>=25.5.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
qa = [
  "ragas>=0.4.3,<0.5.0",
  "litellm>=1.83.7,<1.83.8",
  "instructor>=1.0.0",
  "pyyaml>=6.0",
]

[project.scripts]
docta = "docta.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.3.1",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
]

[tool.pylint.format]
max-line-length = 200

[tool.pylint.design]
max-args = 12              # Allow up to 12 arguments (default: 5)
max-locals = 20            # Allow up to 20 local variables (default: 15)
max-attributes = 12        # Allow up to 12 instance attributes (default: 7)

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",  # Pydantic models and settings are data containers
    "import-outside-toplevel",  # Allow imports inside functions/methods
]

[tool.black]
line-length = 200

[tool.ruff]
line-length = 200

[tool.ruff.lint]
ignore = [
    "E402",  # import-outside-toplevel (module level import not at top of file)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:ragas",
]
markers = [
    "integration: end-to-end tests that make real LLM API calls (run with: pytest -m integration)",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

# Ignore missing imports for optional QA dependencies (ragas, langchain)
# These are only installed with the 'qa' extra
[[tool.mypy.overrides]]
module = [
    "ragas.*",
    "litellm.*",
    "instructor.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
extraPaths = ["src"]
ignore = ["src/qa_generation"]
